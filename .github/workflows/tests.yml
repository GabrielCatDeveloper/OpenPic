name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Los tests marked "live" necesitan el motor Food-R1 real (10 GB de
      # pesos) delante: en CI no esta, asi que se saltan solos.
      - name: Tests
        run: python -m pytest tests/ -q -m "not live"

      - name: Comprobar que los tests se saltan sin motor
        run: python -m pytest tests/ -q -m "live"
